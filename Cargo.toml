[workspace]
members = ["crates/sim-core", "crates/sim-wasm", "tools/data-build"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# Must match the wasm-bindgen CLI exactly. scripts/install-tools.sh reads this line.
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
