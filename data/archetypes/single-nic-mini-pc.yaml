# A generic teaching model. Not a product, and no claim about any product.
id: single-nic-mini-pc
kind: archetype
category: computer
label: Single-NIC mini PC
form: mini_pc
compute:
  arch: x86_64
  ram_gb: 16
  virtualization: true
  nested_virtualization: false
  firmware: uefi
  cooling: fan
  ac_power_recovery: true
  video: { apis: [vaapi, qsv], encode: { h264: true, hevc_8: true } }
network: { nic: [{ speed_mbps: 1000 }], wifi: wifi5 }
ports: { usb: [{ kind: usb5_a, count: 4 }] }
storage:
  bays: [{ interface: m2_nvme, count: 1 }, { interface: sata_2_5, count: 1 }]
  soldered_gb: 0
  boot_from_usb: true
power: { idle_w: 8, load_w: 25 }
