name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: rustup toolchain install
      - run: npm run setup
      # The terminal's Linux image. Rebuilt only when its recipe changes.
      - uses: actions/cache@v6
        id: guest
        with:
          path: app/public/guest
          key: guest-${{ hashFiles('tools/guest/**') }}
      - if: steps.guest.outputs.cache-hit != 'true'
        run: npm run guest
      - run: npm run check
      # Browser tests use the Chrome that ships on the runner and the build `check` just made.
      - run: npm run e2e -w app
      # Traces of failed attempts, including ones that passed on retry.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-traces
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7
