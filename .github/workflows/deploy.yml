name: Deploy preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen*
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: rustup toolchain install
      - run: npm run setup
      # The terminal's Linux image. Rebuilt only when its recipe changes.
      - uses: actions/cache@v6
        id: guest
        with:
          path: app/public/guest
          key: guest-${{ hashFiles('tools/guest/**') }}
      - if: steps.guest.outputs.cache-hit != 'true'
        run: npm run guest
      - run: npm run build
        env:
          VITE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
