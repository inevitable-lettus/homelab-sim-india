# A starting point for the sandbox. Every part is a teaching model.
id: power-cut-proof
title: Staying up through a power cut
summary: "A UPS that feeds the server but not the router, and what that does to reaching it from outside."
world:
  nodes:
    - { kind: internet, id: internet, label: Internet }
    - { kind: isp, id: mobile-network, label: Mobile network, ipv4: cgnat, public_pool: "198.51.100.0/24", cgnat_pool: "100.72.5.0/24", udp_timeout_s: 30 }
    - { kind: host, id: away-phone, label: "Your phone, away from home", role: client, device: phone-client }
    - { kind: isp, id: home-isp, label: Home ISP, ipv4: public, public_pool: "203.0.113.0/24", udp_timeout_s: 60 }
    - { kind: router, id: router, label: Home router, device: retail-router, lan: "192.168.1.0/24", udp_timeout_s: 120, port_forwards: [{ id: media, proto: tcp, external_port: 8096, to_ip: "192.168.1.20", internal_port: 8096 }] }
    - { kind: host, id: server, label: Mini PC, device: single-nic-mini-pc, os: linux-server, services: [{ id: media, label: Media server, proto: tcp, port: 8096, app: media-server }], parts: [{ id: disk, pack: nvme-500gb }], settings: { ac_power_recovery: true } }
    - { kind: power, id: ups, label: UPS, device: ups-600va }
  links:
    - { id: phone-mobile, a: away-phone, b: mobile-network, medium: cellular, length_m: 2000, rate_ab_bps: 8000000, rate_ba_bps: 20000000 }
    - { id: mobile-internet, a: mobile-network, b: internet, medium: backbone, length_m: 840000, rate_ab_bps: 10000000000, rate_ba_bps: 10000000000 }
    - { id: isp-internet, a: home-isp, b: internet, medium: backbone, length_m: 120000, rate_ab_bps: 10000000000, rate_ba_bps: 10000000000 }
    - { id: home-isp-line, a: router, b: home-isp, medium: fibre, length_m: 8000, rate_ab_bps: 50000000, rate_ba_bps: 100000000 }
    - { id: server-router, a: server, b: router, medium: ethernet, length_m: 5, rate_ab_bps: 1000000000, rate_ba_bps: 1000000000 }
  home: { tariff: teaching-slabs, outage: evening-2h }
  power_feeds: [{ from: ups, to: server }]
  intents:
    - { kind: reach, id: reach-away, from: away-phone, host: server, service: media, via: { kind: public_of, node: router } }
    - { kind: survive_outage, id: power-cut, outage: evening-2h, keep: [reach-away] }
    - { kind: yearly_cost, id: running-cost, max_paise: 150000 }
layout:
  wide:
    away-phone: [0, 20]
    mobile-network: [190, 20]
    internet: [380, 20]
    home-isp: [570, 20]
    router: [570, 180]
    server: [380, 180]
    ups: [380, 340]
  narrow:
    away-phone: [0, 0]
    mobile-network: [0, 84]
    internet: [0, 168]
    home-isp: [0, 252]
    router: [0, 336]
    server: [0, 420]
    ups: [0, 504]
